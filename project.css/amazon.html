<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon</title>
    <link rel="stylesheet" href="amazon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav_logo border">
                <div class="logo "></div>
            </div>           
            <div class="nav-location border">
                <p id="add-first">Deliver to</p>
                <div id="country">
                    <!-- to add icon from font font-awesome -->
                    <i class="fa-solid fa-location-dot fa-bounce"></i> 
                    <p>india</p> 
                </div>
            </div>
            <div class="nav-search border">
                <select id="navsearchselect">
                    <option value="all">All</option>
                    <option value="alexa">alexa</option>
                    <option value="deals">deals</option>
                </select>
                <input  id="navsearchinput"placeholder="Search Amazon">
                <button id="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="navsignin border">
                <p>hello,sign-in</p>
                <div id="account">
                    <p>Account & List</p>
                </div> 
            </div>
            <div class="nav-order border">
                <span>return</span>
                <div id="order">
                    <span>& orders</span>
                </div>
            </div>
            <div class="nav-cart border">
                <i style="font-size: 40px;" class="fa-solid fa-cart-shopping"></i>
                <div ><a id="cart" href="https://www.amazon.in/gp/cart/view.html?ref_=nav_cart">cart</a></div>
            </div>
        </div>
        <div class="panel">
            <div id="menu-all">
                <i class="fa-solid fa-bars"></i>
                <span>All</span>
            </div>
            <div class="fresh">
                <div ><a id="fresh"href="https://www.amazon.in/alm/storefront?almBrandId=ctnow&ref_=nav_cs_fresh">fresh</a></div>
            </div>
            <div class="mx-player">
                <div ><a id="mx-player"href="https://www.amazon.in/minitv?ref_=nav_avod_desktop_topnav">Mx-Player</a></div>
            </div>
            <div class="sell">
                <div><a  id="sell"href="https://www.amazon.in/b/32702023031?node=32702023031&ld=AZINSOANavDesktop_T3&ref_=nav_cs_sell_T3">sell</a></div>
            </div>
            <div class="bestseller">
                <div><a  id="bestseller"href="https://www.amazon.in/gp/bestsellers/?ref_=nav_cs_bestsellers">bestseller</a></div>
            </div>
            <div class="todaysdeal" >
                <div><a id="todaysdeal"href="https://www.amazon.in/deals?ref_=nav_cs_gb">todaysdeal</a></div>
            </div>
            <div class="left-image-pannel">
                <div><img src="https://m.media-amazon.com/images/G/31/AmazonVideo/2021/X-site/SingleTitle/March2025/Gladiator2/400x39-SWM_Final_NP._CB549298932_.jpg" alt=""></div>
            </div>
        </div>
        <div class="back-image">
            
        </div>
    </header>
</body>
</html>
